<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -34 528 168" width="1056" height="336">
  <title>Arenix</title>
  <defs>
    <!-- Gold, bright at the top and bottom edges, dark through the middle: a polished metal look. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="-10" x2="0" y2="110">
      <stop offset="0" stop-color="#fff4c4"/>
      <stop offset="0.3" stop-color="#f0c96a"/>
      <stop offset="0.55" stop-color="#a8761f"/>
      <stop offset="0.75" stop-color="#e8b84a"/>
      <stop offset="1" stop-color="#fff0b0"/>
    </linearGradient>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="-20" x2="0" y2="120">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b8cce4"/>
      <stop offset="0.55" stop-color="#6f88a8"/>
      <stop offset="1" stop-color="#dfe9f6"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f8ff"/>
      <stop offset="0.5" stop-color="#5fd8ff"/>
      <stop offset="1" stop-color="#1a6a9a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <!-- One sword pointing up, centered on the origin. -->
    <g id="sword">
      <polygon points="0,-66 7,-52 7,28 -7,28 -7,-52" fill="url(#steel)"/>
      <line x1="0" y1="-52" x2="0" y2="24" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
      <polygon points="-24,28 24,28 20,37 -20,37" fill="url(#gold)"/>
      <rect x="-4.5" y="37" width="9" height="20" fill="#5a3a1c"/>
      <polygon points="0,57 8,65 0,73 -8,65" fill="url(#gold)"/>
    </g>
    <g id="swordOutline" fill="none" stroke="#0b0f1a" stroke-width="7" stroke-linejoin="round">
      <polygon points="0,-66 7,-52 7,28 -7,28 -7,-52"/>
      <polygon points="-24,28 24,28 20,37 -20,37"/>
      <rect x="-4.5" y="37" width="9" height="20"/>
      <polygon points="0,57 8,65 0,73 -8,65"/>
    </g>
  </defs>

  <g filter="url(#shadow)">
    <!-- A R E N I : drawn as thick strokes. Dark outline underneath, gold on top. -->
    <g fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="3">
      <g stroke="#0b0f1a" stroke-width="26">
        <path d="M0 100 L35 0 L70 100"/>
        <path d="M100 100 V0 H140 L158 18 V32 L140 50 H100 M132 50 L160 100"/>
        <path d="M248 0 H190 V100 H248 M190 50 H236"/>
        <path d="M280 100 V0 L330 100 V0"/>
        <path d="M362 0 V100"/>
      </g>
      <g stroke="url(#gold)" stroke-width="16">
        <path d="M0 100 L35 0 L70 100"/>
        <path d="M100 100 V0 H140 L158 18 V32 L140 50 H100 M132 50 L160 100"/>
        <path d="M248 0 H190 V100 H248 M190 50 H236"/>
        <path d="M280 100 V0 L330 100 V0"/>
        <path d="M362 0 V100"/>
      </g>
    </g>
    <!-- The power gem inside the A. -->
    <polygon points="35,50 46,64 35,78 24,64" fill="url(#gem)" stroke="#0b0f1a" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="35,54 41,62 35,62" fill="#ffffff" fill-opacity="0.8"/>

    <!-- X: two crossed swords. -->
    <g transform="translate(422 50)">
      <use href="#swordOutline" transform="rotate(-32)"/>
      <use href="#swordOutline" transform="rotate(32)"/>
      <use href="#sword" transform="rotate(-32)"/>
      <use href="#sword" transform="rotate(32)"/>
    </g>
  </g>
</svg>
