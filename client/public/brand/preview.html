<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arenix logo</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0a1322; color: #cfdcef; }
  section { padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: center; }
  .dark { background: radial-gradient(ellipse at 50% 40%, #1d3354, #0a1322 70%); }
  .light { background: #eef1f5; }
  .word { width: min(92vw, 560px); }
  .row img { display: block; }
  small { display: block; text-align: center; margin-top: 6px; font-size: 12px; opacity: .7; }
  .light small { color: #333; }
</style>
</head>
<body>
  <section class="dark"><img class="word" src="arenix-wordmark.svg" alt="Arenix"></section>
  <section class="light"><img class="word" src="arenix-wordmark.svg" alt="Arenix"></section>
  <section class="dark row">
    <div><img src="arenix-icon.svg" width="192" height="192" alt=""><small>192</small></div>
    <div><img src="arenix-icon.svg" width="96" height="96" alt="" style="border-radius:22px"><small>96 · bo góc</small></div>
    <div><img src="arenix-icon.svg" width="48" height="48" alt="" style="border-radius:11px"><small>48</small></div>
  </section>
</body>
</html>
