<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Arenix</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#24406a"/>
      <stop offset="0.6" stop-color="#0f1b2e"/>
      <stop offset="1" stop-color="#060b14"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="472">
      <stop offset="0" stop-color="#fff4c4"/>
      <stop offset="0.3" stop-color="#f0c96a"/>
      <stop offset="0.55" stop-color="#a8761f"/>
      <stop offset="0.78" stop-color="#e8b84a"/>
      <stop offset="1" stop-color="#fff0b0"/>
    </linearGradient>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="-150" x2="0" y2="120">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b8cce4"/>
      <stop offset="0.55" stop-color="#6f88a8"/>
      <stop offset="1" stop-color="#dfe9f6"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0faff"/>
      <stop offset="0.5" stop-color="#5fd8ff"/>
      <stop offset="1" stop-color="#155a85"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fd8ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5fd8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- One big sword pointing up, centered on the origin. -->
    <g id="sword">
      <polygon points="0,-150 16,-118 16,62 -16,62 -16,-118" fill="url(#steel)" stroke="#0b0f1a" stroke-width="8" stroke-linejoin="round"/>
      <line x1="0" y1="-118" x2="0" y2="54" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4"/>
      <polygon points="-54,62 54,62 46,82 -46,82" fill="url(#gold)" stroke="#0b0f1a" stroke-width="8" stroke-linejoin="round"/>
      <rect x="-10" y="82" width="20" height="44" fill="#5a3a1c" stroke="#0b0f1a" stroke-width="8"/>
      <polygon points="0,126 18,144 0,162 -18,144" fill="url(#gold)" stroke="#0b0f1a" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Beveled hexagon frame: dark edge, gold band, thin inner line. -->
  <polygon points="256,22 458,139 458,373 256,490 54,373 54,139" fill="none" stroke="#0b0f1a" stroke-width="34" stroke-linejoin="miter"/>
  <polygon points="256,22 458,139 458,373 256,490 54,373 54,139" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linejoin="miter"/>
  <polygon points="256,58 427,157 427,355 256,454 85,355 85,157" fill="none" stroke="#e8c26a" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Crossed swords: the X. -->
  <g transform="translate(256 280)">
    <use href="#sword" transform="rotate(-34)"/>
    <use href="#sword" transform="rotate(34)"/>
  </g>

  <!-- The A: a gold chevron roofing the swords. -->
  <path d="M150 300 L256 110 L362 300" fill="none" stroke="#0b0f1a" stroke-width="58" stroke-linejoin="miter" stroke-miterlimit="4"/>
  <path d="M150 300 L256 110 L362 300" fill="none" stroke="url(#gold)" stroke-width="40" stroke-linejoin="miter" stroke-miterlimit="4"/>
  <path d="M140 286 L256 94 L372 286" fill="none" stroke="#fff8dc" stroke-opacity="0.6" stroke-width="4"/>

  <!-- Power gem where the swords cross. -->
  <circle cx="256" cy="240" r="70" fill="url(#glow)"/>
  <polygon points="256,196 288,240 256,284 224,240" fill="url(#gem)" stroke="#0b0f1a" stroke-width="9" stroke-linejoin="round"/>
  <polygon points="256,208 274,236 256,236" fill="#ffffff" fill-opacity="0.85"/>
</svg>
