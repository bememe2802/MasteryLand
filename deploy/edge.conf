# Arenix's own front door on the VPS, in container arenix-edge (nothing shared with other sites).
# Cloudflare proxies https://arenix.fun to this host on port 8443 (an Origin Rule picks the port)
# and checks nothing about the certificate here ("Full" mode), so a self-signed one is enough.

# Only Cloudflare's edges reach this port (host firewall); they pass the visitor in CF-Connecting-IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8443 ssl;
    server_name arenix.fun www.arenix.fun;
    ssl_certificate /etc/arenix/cert.pem;
    ssl_certificate_key /etc/arenix/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.arenix.fun) {
        return 301 https://arenix.fun$request_uri;
    }

    location / {
        set $game http://arenix:3000;
        proxy_pass $game;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Game sockets stay open for a whole play session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
