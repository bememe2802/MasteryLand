<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16201a">
<title>Mastery Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay"></canvas>

<div id="topbar">
  <button id="btnStats" class="icon-btn" aria-label="Chỉ số"><span class="ms">person</span></button>
  <div class="bars">
    <div class="hp"><i id="hpfill"></i><span id="hptext"></span></div>
    <div class="mx"><i id="mxfill"></i></div>
  </div>
  <span id="safeChip" class="chip hidden" aria-label="Vùng an toàn"><span class="ms">shield_with_heart</span></span>
  <span id="netChip" class="chip warn hidden" aria-label="Mất kết nối"><span class="ms">wifi_off</span></span>
</div>

<canvas id="minimap" width="200" height="200"></canvas>
<div id="zone"></div>
<div id="toasts"></div>
<div id="queueChip" class="pill hidden"><span class="ms spin">progress_activity</span><b id="queueTime">0:00</b><button id="queueCancel" aria-label="Hủy"><span class="ms">close</span></button></div>
<div id="arenaHud" class="hidden">
  <div class="opp"><b id="oppName"></b><div class="hp"><i id="oppFill"></i></div></div>
  <div id="arenaTime">1:30</div>
</div>
<div id="bigText"></div>

<div id="joyzone"><div id="joybase"><div id="joyknob"></div></div></div>

<div id="actions">
  <button id="btnAct" class="act sm gold hidden"><span class="ms" id="actIcon">storefront</span></button>
  <button id="btnPot" class="act sm hidden" aria-label="Uống thuốc"><span class="ms">water_drop</span><b id="potCount"></b></button>
  <button id="btnSwap" class="act sm" aria-label="Đổi vũ khí"><span class="ms">sync_alt</span></button>
  <button id="btnSkill" class="act md" aria-label="Kỹ năng"><span class="ms" id="skillIcon">explosion</span><b id="skillCd"></b><span class="ms lock" id="skillLock">lock</span></button>
  <button id="btnAtk" class="act lg" aria-label="Đánh"><span class="ms" id="atkIcon">sports_mma</span></button>
</div>

<div id="statsModal" class="modal hidden">
  <div class="sheet">
    <header>
      <h2 id="meName"></h2>
      <button class="close" id="btnRename" aria-label="Đổi tên"><span class="ms">edit</span></button>
      <button class="close" id="btnLogout" aria-label="Đăng xuất"><span class="ms">logout</span></button>
      <button class="close" data-close><span class="ms">close</span></button>
    </header>
    <form id="renameForm" class="hidden"><input id="renameInput" maxlength="16" autocomplete="off" spellcheck="false"><button type="submit"><span class="ms">check</span></button></form>
    <p id="renameErr" class="err"></p>
    <div id="statsBody"></div>
  </div>
</div>

<div id="shopModal" class="modal hidden">
  <div class="sheet">
    <header><h2 id="shopTitle"></h2><span class="gold"><span class="ms">paid</span><b id="shopGold">0</b></span><button class="close" data-close><span class="ms">close</span></button></header>
    <nav class="tabs" id="shopTabs"></nav>
    <div id="shopList"></div>
  </div>
</div>

<div id="arenaModal" class="modal hidden">
  <div class="sheet">
    <header><h2>Đấu Trường</h2><button class="close" data-close><span class="ms">close</span></button></header>
    <div class="arena-card">
      <div><span class="ms">military_tech</span><b id="arRating">1000</b><small>Điểm</small></div>
      <div><span class="ms">emoji_events</span><b id="arWins">0</b><small>Thắng</small></div>
      <div><span class="ms">heart_broken</span><b id="arLosses">0</b><small>Thua</small></div>
    </div>
    <button id="btnQueue" class="cta"><span class="ms">swords</span>Tìm trận 1 vs 1</button>
  </div>
</div>

<div id="mapModal" class="modal hidden"><canvas id="bigmap" width="720" height="720"></canvas></div>

<div id="death" class="hidden"><div><h1>Gục ngã</h1></div></div>
<div id="kicked" class="modal hidden"><div class="sheet center"><span class="ms big">devices</span><p>Tài khoản đang chơi ở nơi khác</p><button class="cta" id="btnReload">Vào lại</button></div></div>

<div id="loading">
  <div>
    <h1>Mastery Land</h1>
    <div class="lbar"><i id="lfill"></i></div>
    <div id="auth" class="hidden">
      <div id="gbtn"></div>
      <button id="devLogin" class="ghost hidden">Đăng nhập thử</button>
      <p id="authErr" class="err"></p>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
